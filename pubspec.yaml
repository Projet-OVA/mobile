name: SIRA
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  carousel_slider: ^5.0.0
  google_fonts: ^6.3.2
  cupertino_icons: ^1.0.8

  # Réseau & stockage
  http: ^1.2.2
  shared_preferences: ^2.4.13
  intl: ^0.19.0

  # Médias
  image_picker: ^1.1.2
  video_player: ^2.10.0
  chewie: ^1.8.1
  confetti: ^0.7.0
  audioplayers: ^5.2.1
  
  # Cache d'images
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logoSira2.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/videos/